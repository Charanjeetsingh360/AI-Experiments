<header class="cs-top-bar" role="banner">
  <div class="cs-top-bar__left">
    <button class="cs-top-bar__icon-btn" (click)="menuToggle.emit()" aria-label="Toggle menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        e x1="3" y1="6" x2="21" y2="6"/>
        e x1="3" y1="12" x2="21" y2="12"/>
        e x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="cs-top-bar__brand" *ngIf="title">
      <span class="cs-top-bar__title">{{ title }}</span>
      <span class="cs-top-bar__subtitle" *ngIf="subtitle">{{ subtitle }}</span>
    </div>
  </div>
  <div class="cs-top-bar__right">
    <button *ngIf="showSearch" class="cs-top-bar__icon-btn" (click)="searchClick.emit()" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        ircle cx="11" cy="11" r="8"/>
        e x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
    <button *ngIf="showNotifications" class="cs-top-bar__icon-btn cs-top-bar__notif-btn"
      (click)="notificationsClick.emit()" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span *ngIf="notificationCount > 0" class="cs-top-bar__badge">{{ badgeLabel }}</span>
    </button>
    <button *ngIf="showAvatar" class="cs-top-bar__avatar-btn" (click)="avatarClick.emit()" aria-label="User menu">
      <span class="cs-top-bar__avatar">
        <img *ngIf="avatarSrc" [src]="avatarSrc" [alt]="userName" class="cs-top-bar__avatar-img" />
        <span *ngIf="!avatarSrc" class="cs-top-bar__avatar-initials">
          {{ avatarInitials || userName.substring(0,2).toUpperCase() }}
        </span>
      </span>
      <span class="cs-top-bar__username" *ngIf="userName">{{ userName }}</span>
    </button>
  </div>
</header>
