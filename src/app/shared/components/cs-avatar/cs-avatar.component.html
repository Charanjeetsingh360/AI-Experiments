<span [class]="hostClasses" [style.background-color]="!showImage ? color : null" [attr.aria-label]="alt">
  <img *ngIf="showImage" [src]="src" [alt]="alt" class="cs-avatar__img" (error)="onImageError()" />
  <span *ngIf="!showImage && computedInitials" class="cs-avatar__initials" aria-hidden="true">{{ computedInitials }}</span>
  <span *ngIf="!showImage && !computedInitials" class="cs-avatar__icon" aria-hidden="true">
    <cs-icon name="person" [size]="iconSize" />
  </span>
  <span *ngIf="status !== 'none'" [class]="'cs-avatar__status cs-avatar__status--' + status"></span>
</span>
