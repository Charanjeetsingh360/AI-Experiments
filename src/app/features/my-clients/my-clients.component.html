<div class="flex h-full flex-col overflow-hidden">

  <!-- Page Header -->
  <cs-page-header
    title="Clients"
    description="Click on a client card to view their Care Plan, Emergency Contact and upcoming shifts."
  />

    <!-- Client Grid -->
  <div class="flex-1 overflow-hidden">
    <cs-card-list
      [items]="filteredClients()"
      [totalItems]="totalClients()"
      [columns]="3"
      [pageSize]="9"
      emptyMessage="No clients found"
      (itemClick)="onClientClick($any($event))"
    >
      <ng-template csCardTemplate let-client let-i="index">
        <app-client-card [client]="client" [index]="i" />
      </ng-template>
    </cs-card-list>
  </div>

  <!-- Client Detail Modal -->
  @if (showFlyout() && selectedClient()) {
    <app-client-detail-modal
      [client]="selectedClient()!"
      (close)="closeFlyout()"
    />
  }
</div>
