<div class="flex h-full flex-col overflow-hidden">

  <!-- Page Header -->
  <cs-page-header
    title="Clients"
    description="Click on a client card to view their Care Plan, Emergency Contact and upcoming shifts."
  />

    <!-- Client Grid -->
  <div class="flex-1 overflow-hidden">
    <cs-card-list
      [items]="filteredClients()"
      [totalItems]="totalClients()"
      [columns]="3"
      [pageSize]="9"
      [showPagination]="false"
      emptyMessage="No clients found"
      (itemClick)="onClientClick($any($event))"
    >
      <ng-template csCardTemplate let-client let-i="index">
        <app-client-card [client]="client" [index]="i" />
      </ng-template>
    </cs-card-list>
  </div>

  <!-- ═══════ Client Detail Flyout ═══════ -->
  <app-client-detail-flyout
    [isOpen]="showDetailFlyout()"
    [client]="selectedClient()"
    [upcomingShift]="upcomingShift()"
    [showMapDirections]="showMapDirections()"
    (isOpenChange)="closeDetailFlyout()"
    (closed)="closeDetailFlyout()"
    (actionClicked)="onClientAction($event)"
  />

  <!-- ═══════ Client Contacts Flyout ═══════ -->
  <app-client-contacts-flyout
    [isOpen]="showContactsFlyout()"
    [contacts]="clientContacts()"
    (isOpenChange)="closeContactsFlyout()"
    (closed)="closeContactsFlyout()"
  />

  <!-- ═══════ Client Documents Flyout ═══════ -->
  <app-client-documents-flyout
    [isOpen]="showDocumentsFlyout()"
    [documents]="clientDocuments()"
    (isOpenChange)="closeDocumentsFlyout()"
    (closed)="closeDocumentsFlyout()"
  />

  <!-- ═══════ Client Care Plan Flyout ═══════ -->
  <app-client-care-plan-flyout
    [isOpen]="showCarePlanFlyout()"
    [clientId]="selectedClient()?.id?.toString() || ''"
    (isOpenChange)="closeCarePlanFlyout()"
    (closed)="closeCarePlanFlyout()"
  />

  <!-- ═══════ Client Completed Forms Flyout ═══════ -->
  <app-client-completed-forms-flyout
    [isOpen]="showCompletedFormsFlyout()"
    [clientId]="selectedClient()?.id?.toString() || ''"
    (isOpenChange)="closeCompletedFormsFlyout()"
    (closed)="closeCompletedFormsFlyout()"
  />

  <!-- ═══════ Client Open Shifts Flyout ═══════ -->
  <app-client-open-shifts-flyout
    [isOpen]="showOpenShiftsFlyout()"
    [clientId]="selectedClient()?.id?.toString() || ''"
    (isOpenChange)="closeOpenShiftsFlyout()"
    (closed)="closeOpenShiftsFlyout()"
  />
</div>
