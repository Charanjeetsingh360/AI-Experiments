<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareGiver 360 - HTML Preview (Backup)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* This is a standalone HTML backup - tokens are embedded below */
    
    /* ============= LAYER 1: PRIMITIVES ============= */
    :root {
      --cs360-blue-0: #E8F0FE;
      --cs360-blue-100: #D0E1FC;
      --cs360-blue-200: #A7C6F8;
      --cs360-blue-500: #1F63DA;
      --cs360-blue-600: #164CA8;
      --cs360-blue-700: #123B82;
      --cs360-blue-800: #0E2E63;
      --cs360-blue-900: #0A1E40;
      
      --cs360-neutral-0: #FFFFFF;
      --cs360-neutral-50: #F8FAFC;
      --cs360-neutral-100: #F1F5F9;
      --cs360-neutral-200: #D1D9E2;
      --cs360-neutral-300: #A7B1BF;
      --cs360-neutral-400: #7D8A9C;
      --cs360-neutral-500: #5C6C82;
      --cs360-neutral-700: #2C394B;
      --cs360-neutral-800: #1A2432;
      --cs360-neutral-900: #0D131A;
      
      --cs360-green-500: #10B981;
      --cs360-green-0: #ECFDF0;
      --cs360-red-500: #EF4444;
      --cs360-red-0: #FEF2F3;
      --cs360-amber-500: #F59E0B;
      --cs360-amber-0: #FEF6E2;
      
      --cs360-font-family: 'Inter', sans-serif;
      --cs360-sidebar-width: 260px;
      --cs360-topbar-height: 64px;
      --cs360-radius-md: 8px;
      --cs360-radius-lg: 12px;
      --cs360-space-3: 0.75rem;
      --cs360-space-4: 1rem;
      --cs360-space-5: 1.25rem;
      --cs360-space-6: 1.5rem;
      --cs360-motion-fast: 150ms ease;
      --cs360-shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    /* ============= LAYER 2: SEMANTIC (LIGHT) ============= */
    :root, [data-theme="light"] {
      --cs360-bg: var(--cs360-neutral-50);
      --cs360-bg-surface: var(--cs360-neutral-0);
      --cs360-text-primary: var(--cs360-neutral-900);
      --cs360-text-secondary: var(--cs360-neutral-500);
      --cs360-border-subtle: var(--cs360-neutral-200);
      --cs360-action-primary: var(--cs360-blue-500);
      --cs360-action-primary-text: var(--cs360-neutral-0);
      --cs360-sidebar-bg: var(--cs360-blue-900);
      --cs360-sidebar-text: var(--cs360-neutral-200);
      --cs360-sidebar-text-active: var(--cs360-neutral-0);
      --cs360-topbar-bg: var(--cs360-neutral-0);
      --cs360-topbar-border: var(--cs360-neutral-200);
    }

    /* ============= LAYER 2: SEMANTIC (DARK) ============= */
    [data-theme="dark"] {
      --cs360-bg: var(--cs360-neutral-900);
      --cs360-bg-surface: var(--cs360-neutral-800);
      --cs360-text-primary: var(--cs360-neutral-0);
      --cs360-text-secondary: var(--cs360-neutral-400);
      --cs360-border-subtle: var(--cs360-neutral-700);
      --cs360-topbar-bg: var(--cs360-neutral-800);
      --cs360-topbar-border: var(--cs360-neutral-700);
    }

    /* ============= BASE STYLES ============= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--cs360-font-family); }
    body { background: var(--cs360-bg); color: var(--cs360-text-primary); }

    .app-layout { display: flex; min-height: 100vh; }
    
    .sidebar {
      width: var(--cs360-sidebar-width);
      background: var(--cs360-sidebar-bg);
      padding: var(--cs360-space-5);
      color: var(--cs360-sidebar-text);
    }
    .sidebar-logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--cs360-sidebar-text-active);
      margin-bottom: var(--cs360-space-6);
    }
    .nav-item {
      display: block;
      padding: var(--cs360-space-3) var(--cs360-space-4);
      border-radius: var(--cs360-radius-md);
      color: var(--cs360-sidebar-text);
      text-decoration: none;
      margin-bottom: var(--cs360-space-3);
      transition: all var(--cs360-motion-fast);
    }
    .nav-item:hover, .nav-item.active {
      background: var(--cs360-blue-800);
      color: var(--cs360-sidebar-text-active);
    }

    .main-content { flex: 1; display: flex; flex-direction: column; }
    
    .topbar {
      height: var(--cs360-topbar-height);
      background: var(--cs360-topbar-bg);
      border-bottom: 1px solid var(--cs360-topbar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--cs360-space-6);
    }
    
    .page-content { padding: var(--cs360-space-6); }
    
    .card {
      background: var(--cs360-bg-surface);
      border: 1px solid var(--cs360-border-subtle);
      border-radius: var(--cs360-radius-lg);
      padding: var(--cs360-space-5);
      margin-bottom: var(--cs360-space-5);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      padding: var(--cs360-space-3) var(--cs360-space-5);
      background: var(--cs360-action-primary);
      color: var(--cs360-action-primary-text);
      border: none;
      border-radius: var(--cs360-radius-md);
      cursor: pointer;
      font-weight: 500;
    }

    .theme-switcher { display: flex; gap: 8px; }
    .theme-switcher button {
      padding: 4px 12px;
      border: 1px solid var(--cs360-border-subtle);
      background: var(--cs360-bg-surface);
      border-radius: var(--cs360-radius-md);
      cursor: pointer;
    }
    .theme-switcher button.active {
      background: var(--cs360-action-primary);
      color: white;
      border-color: var(--cs360-action-primary);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">🏥 CareGiver 360</div>
      <nav>
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">My Schedule</a>
        <a href="#" class="nav-item">My Clients</a>
        <a href="#" class="nav-item">Documents</a>
        <a href="#" class="nav-item">Trainings</a>
      </nav>
    </aside>
    
    <div class="main-content">
      <header class="topbar">
        <h1 style="font-size: 1.25rem;">Dashboard</h1>
        <div class="theme-switcher">
          <button onclick="setTheme('light')" class="active" id="btn-light">☀️ Light</button>
          <button onclick="setTheme('dark')" id="btn-dark">🌙 Dark</button>
        </div>
      </header>
      
      <main class="page-content">
        <div class="card">
          <h2>Welcome back! 👋</h2>
          <p style="color: var(--cs360-text-secondary); margin-top: 8px;">
            This is the standalone HTML backup of the CareGiver 360 design system.
          </p>
        </div>
        
        <div class="card">
          <h3>Quick Stats</h3>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px;">
            <div style="padding: 16px; background: var(--cs360-green-0); border-radius: 8px;">
              <div style="font-size: 24px; font-weight: 700;">24</div>
              <div style="color: var(--cs360-text-secondary);">Total Shifts</div>
            </div>
            <div style="padding: 16px; background: var(--cs360-blue-0); border-radius: 8px;">
              <div style="font-size: 24px; font-weight: 700;">186</div>
              <div style="color: var(--cs360-text-secondary);">Hours Worked</div>
            </div>
            <div style="padding: 16px; background: var(--cs360-amber-0); border-radius: 8px;">
              <div style="font-size: 24px; font-weight: 700;">7</div>
              <div style="color: var(--cs360-text-secondary);">Active Clients</div>
            </div>
          </div>
        </div>
        
        <button class="btn">+ New Shift</button>
      </main>
    </div>
  </div>

  <script>
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-switcher button').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + theme).classList.add('active');
    }
  </script>
</body>
</html>
